  </script>

  <style>
    :root {
      --teal-primary: #14b8a6;
      --teal-hover: #0f9888;
      --text-main: #111827;
      --text-muted: #4b5563;
      --text-soft: #6b7280;
      --border: #d1d5db;
      --bg: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: 'Rubik', Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: #ffffff;
    }

    .auth-shell {
      width: 100%;
      max-width: 448px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 48px;
      line-height: 1.1;
      font-weight: 500;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .referee-banner {
      display: none;
      margin-bottom: 24px;
      padding: 14px 16px;
      border: 1px solid #99f6e4;
      background: #f0fdfa;
      color: #115e59;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .referee-banner.active {
      display: block;
    }

    .google-btn,
    .submit-btn,
    .field input {
      width: 100%;
      height: 64px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #111827;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      margin-bottom: 28px;
    }

    .google-btn:hover {
      background: #f9fafb;
      border-color: #c7cdd4;
      transform: translateY(-1px);
    }

    .google-btn:disabled,
    .submit-btn:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .divider {
      position: relative;
      text-align: center;
      margin-bottom: 28px;
      color: var(--text-soft);
      font-size: 16px;
      line-height: 1;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: calc(50% - 34px);
      height: 1px;
      background: var(--border);
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .divider span {
      display: inline-block;
      padding: 0 10px;
      background: #ffffff;
      position: relative;
      z-index: 1;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field label {
      font-size: 16px;
      font-weight: 500;
      color: #374151;
    }

    .field input {
      border: 1px solid var(--border);
      background: #ffffff;
      color: #111827;
      padding: 0 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input::placeholder {
      color: #6b7280;
    }

    .field input:focus {
      border-color: var(--teal-primary);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.14);
    }

    .submit-wrap {
      margin-top: 12px;
    }

    .submit-btn {
      border: none;
      background: var(--teal-primary);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--teal-hover);
      transform: translateY(-1px);
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 18px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--teal-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .footer a:hover {
      color: var(--teal-hover);
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    @media (max-width: 640px) {
      .page {
        padding: 24px 16px;
      }

      .auth-shell {
        max-width: 100%;
      }

      .header h1 {
        font-size: 40px;
      }

      .header p,
      .footer {
        font-size: 16px;
      }

      .google-btn,
      .submit-btn,
      .field input {
        height: 58px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="auth-shell">
      <header class="header">
        <h1>Create your account</h1>
        <p id="headerSubtitle">Start building your professional reference profile</p>
      </header>

      <div id="refereeBanner" class="referee-banner">
        Thanks for providing a reference. Now build your own professional reference profile.
      </div>

      <div id="messageBox" class="message" role="status" aria-live="polite"></div>

      <button type="button" class="google-btn" id="googleBtn" aria-label="Continue with Google">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="divider"><span>OR</span></div>

      <form id="authForm" class="form" novalidate>
        <div class="field">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="submit-wrap">
          <button type="submit" class="submit-btn" id="submitBtn">Create account</button>
        </div>
      </form>

      <div class="footer">
        Already have an account? <a href="/landing/login.html">Log in</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = window.__SUPABASE_URL__;
    const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__;
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const url = new URL(window.location.href);
    const form = document.getElementById("authForm");
    const submitBtn = document.getElementById("submitBtn");
    const googleBtn = document.getElementById("googleBtn");
    const messageBox = document.getElementById("messageBox");

    function showMessage(text, type = "error") {
      messageBox.textContent = text;
      messageBox.className = `message show ${type}`;
    }

    function clearMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    const refereeInfo = localStorage.getItem("hrkey_referee_info");
    if (refereeInfo) {
      try {
        const data = JSON.parse(refereeInfo);
        if (data.hasProvidedReference) {
          document.getElementById("refereeBanner").classList.add("active");
          document.getElementById("headerSubtitle").textContent = "Start building your own professional reference profile";
        }
      } catch (err) {
        console.warn("Referee info parse failed:", err);
      }
    }

    const code = url.searchParams.get("code");
    const errorDesc = url.searchParams.get("error_description");
    if (errorDesc) {
      console.error("Auth error:", errorDesc);
      showMessage(errorDesc, "error");
    }

    if (code) {
      try {
        const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);

        if (error) {
          console.error("exchangeCodeForSession error:", error);
          showMessage(error.message || "Authentication failed.", "error");
        } else {
          const next = getNextPath();
          const cleanUrl = `${window.location.origin}/landing/auth.html`;
          history.replaceState({}, document.title, cleanUrl);
          window.location.replace(next);
        }
      } catch (e) {
        console.error("Exchange failed:", e);
        showMessage("Authentication exchange failed.", "error");
      }
    }

    googleBtn.addEventListener("click", async () => {
      clearMessage();
      googleBtn.disabled = true;
      const oldText = googleBtn.innerHTML;
      googleBtn.innerHTML = "<span>Connecting to Google...</span>";

      try {
        const redirectTo = `${window.location.origin}/landing/auth.html`;
        const params = new URLSearchParams();
        params.set("next", getNextPath());
        const finalRedirect = `${redirectTo}?${params.toString()}`;

        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: finalRedirect }
        });

        if (error) {
          throw error;
        }
      } catch (e) {
        console.error("Google OAuth failed:", e);
        showMessage(e?.message || "Failed to connect with Google.", "error");
        googleBtn.disabled = false;
        googleBtn.innerHTML = oldText;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessage();

      const name = document.getElementById("name")?.value?.trim() || "";
      const email = document.getElementById("email")?.value?.trim() || "";
      const password = document.getElementById("password")?.value || "";

      if (!name || !email || !password) {
        showMessage("Please complete all fields.", "error");
        return;
      }

      submitBtn.disabled = true;
      const oldText = submitBtn.textContent;
      submitBtn.textContent = "Creating account...";

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: `${window.location.origin}/landing/auth.html?next=/landing/app.html`,
            data: {
              full_name: name
            }
          }
        });

        if (error) {
          throw error;
        }

        localStorage.setItem("hrkey_user_data", JSON.stringify({
          name,
          email,
          authenticated: !!data?.session,
          loginDate: new Date().toISOString(),
          source: refereeInfo ? "referee_conversion" : "direct_signup"
        }));

        localStorage.setItem("hrkey_user_plan", JSON.stringify({
          plan: "free",
          features: {
            maxReferences: 1,
            canUseBlockchain: false,
            canExportPDF: false
          },
          usage: {
            referencesUsed: 0
          }
        }));

        if (data?.session) {
          window.location.replace("/landing/app.html");
          return;
        }

        showMessage("Account created. Check your email to verify your account.", "success");
      } catch (err) {
        console.error("Sign up error:", err);
        showMessage(err?.message || "Could not create the account.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = oldText;
      }
    });
  </script>
</body>
</html>
