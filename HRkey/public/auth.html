<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRKey - Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #5b6475;
      --line: #d8dde6;
      --input-bg: #f7f8fb;
      --accent: #25c7c3;
      --accent-hover: #1fb6b2;
      --shadow: 0 18px 48px rgba(15, 23, 42, 0.10);
      --radius-xl: 22px;
      --radius-lg: 14px;
      --radius-md: 12px;
      --max-width: 760px;
      --field-height: 66px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: 'Inter', Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 199, 195, 0.08), transparent 28%),
        linear-gradient(180deg, #f8fafc 0%, #f2f4f7 100%);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-shell {
      width: 100%;
      max-width: var(--max-width);
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(216, 221, 230, 0.8);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      padding: 56px 56px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(37, 199, 195, 0.10);
      color: #0f766e;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 3.5rem);
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #0b1b3a;
    }

    .subtitle {
      margin: 18px auto 0;
      max-width: 560px;
      font-size: 1.2rem;
      line-height: 1.5;
      color: #546074;
      font-weight: 500;
    }

    .form-wrap {
      max-width: 610px;
      margin: 0 auto;
    }

    .google-btn,
    .submit-btn {
      width: 100%;
      height: var(--field-height);
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      font-family: inherit;
      font-size: 1.06rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .google-btn {
      background: #ffffff;
      color: #101828;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.03);
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(15, 23, 42, 0.07);
      border-color: #c9d1dd;
    }

    .google-icon {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 28px 0 24px;
      color: #7a8497;
      font-size: 1rem;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 1.02rem;
      font-weight: 700;
      color: #20304b;
    }

    input {
      width: 100%;
      height: var(--field-height);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--input-bg);
      padding: 0 18px;
      font-size: 1.04rem;
      color: #111827;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input::placeholder {
      color: #8a94a6;
    }

    input:focus {
      background: #ffffff;
      border-color: rgba(37, 199, 195, 0.9);
      box-shadow: 0 0 0 4px rgba(37, 199, 195, 0.12);
    }

    .submit-btn {
      margin-top: 16px;
      background: var(--accent);
      color: white;
      border: none;
      box-shadow: 0 14px 28px rgba(37, 199, 195, 0.28);
    }

    .submit-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 18px 32px rgba(37, 199, 195, 0.34);
    }

    .submit-btn:disabled,
    .google-btn:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 1.02rem;
      color: #5f697c;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .notice {
      display: none;
      margin: 0 auto 24px;
      max-width: 610px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .notice.show {
      display: block;
    }

    .notice.info {
      background: rgba(37, 199, 195, 0.10);
      border: 1px solid rgba(37, 199, 195, 0.28);
      color: #0f766e;
    }

    .notice.error {
      background: rgba(239, 68, 68, 0.09);
      border: 1px solid rgba(239, 68, 68, 0.20);
      color: #b42318;
    }

    @media (max-width: 768px) {
      body {
        padding: 24px 14px;
      }

      .auth-card {
        padding: 34px 20px 26px;
        border-radius: 18px;
      }

      .subtitle {
        font-size: 1.02rem;
      }

      .google-btn,
      .submit-btn,
      input {
        height: 58px;
      }

      label {
        font-size: 0.97rem;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <header class="header">
        <div class="eyebrow">HRKey</div>
        <h1>Create your account</h1>
        <p class="subtitle">Start building your professional reference profile</p>
      </header>

      <div id="messageBox" class="notice info" aria-live="polite"></div>

      <section class="form-wrap">
        <button id="googleBtn" class="google-btn" type="button" aria-label="Continue with Google">
          <span class="google-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.5 3.9-5.5 3.9-3.3 0-6-2.7-6-6s2.7-6 6-6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.4 14.7 2.5 12 2.5 6.8 2.5 2.5 6.8 2.5 12S6.8 21.5 12 21.5c6.9 0 9.1-4.8 9.1-7.3 0-.5 0-.8-.1-1.1H12z"/>
              <path fill="#34A853" d="M3.6 7.4l3.2 2.3C7.7 7.7 9.7 6 12 6c1.9 0 3.2.8 3.9 1.5l2.7-2.6C16.9 3.4 14.7 2.5 12 2.5 8.2 2.5 4.9 4.7 3.6 7.4z"/>
              <path fill="#FBBC05" d="M12 21.5c2.6 0 4.8-.9 6.4-2.4l-3-2.4c-.8.6-1.9 1.1-3.4 1.1-3.9 0-5.3-2.6-5.5-3.9l-3.2 2.5c1.3 2.8 4.3 5.1 8.7 5.1z"/>
              <path fill="#4285F4" d="M21.1 12.1c0-.6-.1-1-.2-1.5H12v3.9h5.5c-.3 1.4-1.2 2.4-2.1 3.1l3 2.4c1.8-1.7 2.7-4.2 2.7-7.9z"/>
            </svg>
          </span>
          <span>Continue with Google</span>
        </button>

        <div class="divider">OR</div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" name="fullName" type="text" placeholder="Enter your full name" autocomplete="name" required />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="email" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required />
          </div>

          <button id="submitBtn" class="submit-btn" type="submit">Create account</button>
        </form>

        <div class="footer">
          Already have an account? <a href="/landing/app.html">Log in</a>
        </div>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById('signupForm');
    const googleBtn = document.getElementById('googleBtn');
    const submitBtn = document.getElementById('submitBtn');
    const messageBox = document.getElementById('messageBox');

    function showMessage(text, type = 'info') {
      messageBox.textContent = text;
      messageBox.className = 'notice show ' + type;
    }

    function clearMessage() {
      messageBox.textContent = '';
      messageBox.className = 'notice info';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearMessage();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!fullName || !email || !password) {
        showMessage('Please complete all fields.', 'error');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Creating account...';

      try {
        /**
         * TEMPORARY FRONTEND FLOW
         * Aquí después conectamos Supabase o tu backend real.
         */
        localStorage.setItem('hrkey_signup_draft', JSON.stringify({
          fullName,
          email,
          createdAt: new Date().toISOString()
        }));

        setTimeout(() => {
          showMessage('UI flow ready. Next step is connecting real signup.', 'info');
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;

          // Si quieres mandar al siguiente paso visual:
          // window.location.href = '/landing/app.html';
        }, 500);
      } catch (error) {
        console.error(error);
        showMessage('Something went wrong while creating the account.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });

    googleBtn.addEventListener('click', function () {
      clearMessage();
      googleBtn.disabled = true;
      const originalText = googleBtn.innerHTML;
      googleBtn.innerHTML = '<span>Connecting to Google...</span>';

      setTimeout(() => {
        showMessage('Google sign-in UI is ready. Next step is wiring the real auth provider.', 'info');
        googleBtn.disabled = false;
        googleBtn.innerHTML = originalText;
      }, 500);
    });
  </script>
</body>
</html>
